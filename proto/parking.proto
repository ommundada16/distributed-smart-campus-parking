syntax = "proto3";

package parking;

message Empty {}

// ======================= Coordinator (3 replicas, 1 elected leader) =======================
service Coordinator {
  // Called by zone nodes (leader only)
  rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

  // Called by the API gateway (leader only)
  rpc FindParking (FindParkingRequest) returns (FindParkingResponse);
  rpc ReleaseParking (ReleaseParkingRequest) returns (ReleaseParkingResponse);
  rpc GetSystemStatus (SystemStatusRequest) returns (SystemStatusResponse);

  // Bully election + leader beacon (replica <-> replica)
  rpc Election (ElectionRequest) returns (ElectionResponse);
  rpc Announce (AnnounceRequest) returns (AnnounceResponse);
  rpc Beacon (BeaconRequest) returns (BeaconResponse);

  // Any replica answers these
  rpc WhoIsLeader (Empty) returns (LeaderInfo);
  rpc SetFailureMode (SetFailureModeRequest) returns (SetFailureModeResponse);
}

// ======================= Zone nodes =======================
service ZoneService {
  rpc GetZoneStatus (ZoneStatusRequest) returns (ZoneStatusResponse);
  rpc GetAvailableSlots (AvailableSlotsRequest) returns (AvailableSlotsResponse);
  rpc ReserveSlot (ReserveSlotRequest) returns (ReserveSlotResponse);
  rpc ReleaseSlot (ReleaseSlotRequest) returns (ReleaseSlotResponse);
  rpc SetFailureMode (SetFailureModeRequest) returns (SetFailureModeResponse);

  // Ricart-Agrawala mutual exclusion over the shared overflow lot
  rpc OverflowBook (OverflowBookRequest) returns (OverflowBookResponse);
  rpc OverflowRelease (OverflowReleaseRequest) returns (Ack);
  rpc RequestCS (RaRequest) returns (RaReply);                     // peer -> peer

  // Replicated hash-chained ledger
  rpc AppendBlock (AppendBlockRequest) returns (AppendBlockResponse);
  rpc GetBlocks (GetBlocksRequest) returns (GetBlocksResponse);
  rpc VerifyLedger (Empty) returns (LedgerStatus);
  rpc TamperLedger (TamperRequest) returns (Ack);
  rpc RepairLedger (Empty) returns (LedgerStatus);
}

message Ack {
  bool success = 1;
  string message = 2;
}

// ---------- registration / heartbeat ----------
message RegisterNodeRequest {
  string node_id = 1;
  string zone_id = 2;
  string host = 3;
  int32 grpc_port = 4;
  int32 total_slots = 5;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  string server_time = 2;
  int32 leader_id = 3;
}

// ---------- zone status ----------
message ZoneStatusRequest {}

message ZoneStatusResponse {
  string zone_id = 1;
  string node_id = 2;
  int32 total_slots = 3;
  int32 available_slots = 4;
  int32 occupied_slots = 5;
  int32 reserved_slots = 6;
  string status = 7;
  int32 ledger_length = 8;
}

message AvailableSlotsRequest {}

message AvailableSlotsResponse {
  int32 available_count = 1;
  repeated string slot_ids = 2;
}

message ReserveSlotRequest {
  string reservation_id = 1;
}

message ReserveSlotResponse {
  bool success = 1;
  string slot_id = 2;
  string message = 3;
}

message ReleaseSlotRequest {
  string slot_id = 1;
  string reservation_id = 2;
}

message ReleaseSlotResponse {
  bool success = 1;
  string message = 2;
  string slot_id = 3;
}

// ---------- parking (gateway <-> coordinator) ----------
message FindParkingRequest {
  string policy = 1;   // first_fit | round_robin | least_loaded (empty = leader default)
}

message FindParkingResponse {
  bool success = 1;
  string zone_id = 2;
  string node_id = 3;
  string slot_id = 4;
  string reservation_id = 5;
  string message = 6;
  double price_per_hour = 7;
  string price_source = 8;
  int32 ledger_block = 9;
  string policy = 10;
  string served_by = 11;
  int64 lamport = 12;
}

message ReleaseParkingRequest {
  string reservation_id = 1;
}

message ReleaseParkingResponse {
  bool success = 1;
  string message = 2;
}

message SystemStatusRequest {}

message NodeInfo {
  string node_id = 1;
  string zone_id = 2;
  string host = 3;
  int32 port = 4;
  string status = 5;
  string last_heartbeat = 6;
  int32 total_slots = 7;
  int32 available_slots = 8;
  int32 occupied_slots = 9;
  int32 reserved_slots = 10;
  int32 ledger_length = 11;
}

message SystemStatusResponse {
  repeated NodeInfo nodes = 1;
  int32 leader_id = 2;
  int32 term = 3;
}

message SetFailureModeRequest {
  bool simulate_failure = 1;
}

message SetFailureModeResponse {
  bool success = 1;
  string status = 2;
}

// ---------- election ----------
message ElectionRequest { int32 from_id = 1; }
message ElectionResponse { bool ok = 1; int32 term = 2; }
message AnnounceRequest { int32 leader_id = 1; int32 term = 2; }
message AnnounceResponse { bool accepted = 1; }
message BeaconRequest { int32 leader_id = 1; int32 term = 2; }
message BeaconResponse { int32 leader_id = 1; int32 term = 2; }

message LeaderInfo {
  int32 self_id = 1;
  string self_node = 2;
  int32 leader_id = 3;
  int32 term = 4;
  string state = 5;        // UP | FAILING
  string host = 6;
  int32 port = 7;
}

// ---------- mutual exclusion ----------
message OverflowBookRequest {
  bool use_mutex = 1;
  int32 hold_ms = 2;
  string booking_id = 3;
}

message OverflowBookResponse {
  bool success = 1;
  string message = 2;
  string node_id = 3;
  int32 saw_free = 4;
  int64 request_ts = 5;     // Lamport timestamp of this zone's REQUEST (0 when run without the mutex)
  double entered_at = 6;
  double exited_at = 7;
  repeated string trace = 8;
}

message OverflowReleaseRequest { string booking_id = 1; }

message RaRequest {
  string resource = 1;
  int64 ts = 2;
  string from_node = 3;
}

message RaReply { bool granted = 1; }

// ---------- ledger ----------
message AppendBlockRequest { string block_json = 1; }

message AppendBlockResponse {
  bool success = 1;
  string message = 2;
  int32 length = 3;
}

message GetBlocksRequest { int32 from_index = 1; }
message GetBlocksResponse { repeated string blocks_json = 1; }

message LedgerStatus {
  string node_id = 1;
  bool valid = 2;
  int32 bad_index = 3;
  int32 length = 4;
  string head_hash = 5;
  string message = 6;
}

message TamperRequest { int32 index = 1; }
