worker_processes 1;   # one worker so round-robin state is shared (each worker keeps its own counter)
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ---- load balancing: spread HTTP requests over the gateway replicas ----
  upstream gateways {
    # round-robin (Nginx default): requests alternate between replicas. `least_conn;` would send each
    # request to the replica with the fewest in-flight requests - better for slow, uneven requests.
    server gateway-1:8000 max_fails=2 fail_timeout=5s;
    server gateway-2:8000 max_fails=2 fail_timeout=5s;
  }

  # ---- edge cache (Cloudflare-style): small, short-lived, shared across all visitors ----
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:5m max_size=20m inactive=60s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location /api/ {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_next_upstream error timeout http_502 http_503;   # failover to the other gateway
      proxy_read_timeout 180s;
      add_header X-Upstream $upstream_addr always;
    }

    # Public availability summary is identical for every visitor -> cache it at the edge for 5 s.
    location = /api/edge/summary {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_cache edge;
      proxy_cache_valid 200 5s;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Upstream $upstream_addr always;
    }

    location /ws {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
