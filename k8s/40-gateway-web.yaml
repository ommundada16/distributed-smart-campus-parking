# Gateways are stateless, so Kubernetes can scale them freely: a Service load-balances across the pods
# and a HorizontalPodAutoscaler adds replicas when CPU rises (needs metrics-server).
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: campus-parking }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: campus-parking/backend:fa2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gateway.main"]
          envFrom: [{ configMapRef: { name: campus-config } }]
          env:
            - name: GATEWAY_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }   # pod name shows up as X-Served-By
            - { name: GATEWAY_PORT, value: "8000" }
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: campus-parking }
spec:
  selector: { app: gateway }
  ports: [{ port: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway, namespace: campus-parking }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
# Edge: serves the UI and proxies /api and /ws to the gateway Service (the upstream below is the
# Service name, so Kubernetes - not Nginx - does the per-request load balancing in this deployment).
apiVersion: v1
kind: ConfigMap
metadata: { name: web-nginx, namespace: campus-parking }
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:5m max_size=20m inactive=60s;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 80;
        root /usr/share/nginx/html;
        location / { try_files $uri /index.html; }
        location /api/ {
          proxy_pass http://gateway:8000;
          proxy_http_version 1.1;
          proxy_read_timeout 180s;
        }
        location = /api/edge/summary {
          proxy_pass http://gateway:8000;
          proxy_cache edge;
          proxy_cache_valid 200 5s;
          add_header X-Cache-Status $upstream_cache_status always;
        }
        location /ws {
          proxy_pass http://gateway:8000;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: campus-parking }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: campus-parking/web:fa2
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
      volumes:
        - name: conf
          configMap: { name: web-nginx }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: campus-parking }
spec:
  type: NodePort
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
