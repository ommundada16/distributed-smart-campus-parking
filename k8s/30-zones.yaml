# One Deployment + Service per parking zone. Zones are NOT interchangeable replicas - each owns its own
# slot state - so they are three separately-named workloads rather than replicas of one.
apiVersion: apps/v1
kind: Deployment
metadata: { name: zone-a, namespace: campus-parking }
spec:
  replicas: 1
  selector: { matchLabels: { app: zone-a } }
  template:
    metadata: { labels: { app: zone-a, tier: zone } }
    spec:
      containers:
        - name: zone
          image: campus-parking/backend:fa2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.zone.zone_service", "--zone", "A"]
          envFrom: [{ configMapRef: { name: campus-config } }]
          ports: [{ containerPort: 5001 }, { containerPort: 6001 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe: { tcpSocket: { port: 5001 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 5001 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: zone-a, namespace: campus-parking }
spec:
  selector: { app: zone-a }
  ports: [{ name: grpc, port: 5001 }, { name: p2p, port: 6001 }]
---
