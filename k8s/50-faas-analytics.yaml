apiVersion: apps/v1
kind: Deployment
metadata: { name: faas, namespace: campus-parking }
spec:
  replicas: 1
  selector: { matchLabels: { app: faas } }
  template:
    metadata: { labels: { app: faas } }
    spec:
      containers:
        - name: faas
          image: campus-parking/backend:fa2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.faas.runtime:app", "--host", "0.0.0.0", "--port", "9000"]
          envFrom: [{ configMapRef: { name: campus-config } }]
          ports: [{ containerPort: 9000 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /health, port: 9000 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: faas, namespace: campus-parking }
spec:
  selector: { app: faas }
  ports: [{ port: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics, namespace: campus-parking }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics } }
  template:
    metadata: { labels: { app: analytics } }
    spec:
      containers:
        - name: analytics
          image: campus-parking/backend:fa2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.analytics.service:app", "--host", "0.0.0.0", "--port", "9100"]
          envFrom: [{ configMapRef: { name: campus-config } }]
          ports: [{ containerPort: 9100 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe: { httpGet: { path: /health, port: 9100 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: analytics, namespace: campus-parking }
spec:
  selector: { app: analytics }
  ports: [{ port: 9100 }]
